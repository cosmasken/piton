# Foundry is used only for property-based fuzz and stateful invariant tests (test/foundry).
# Hardhat remains the main build/test tool. Setup: npm run fuzz:setup (installs forge-std into lib/).
[profile.default]
src = "contracts"
test = "test/foundry"
out = "out-forge"
cache_path = "cache-forge"
libs = ["node_modules", "lib"]
solc_version = "0.8.28"
evm_version = "london"
optimizer = true
optimizer_runs = 200
via_ir = true
# Mezo's fetched protocol contracts (0.8.24 + cancun-only OZ utils) are not needed here
skip = ["contracts/mezo/**", "contracts/test/MezoProxy.sol"]
remappings = [
  "@openzeppelin/=node_modules/@openzeppelin/",
  "forge-std/=lib/forge-std/src/",
]

[fuzz]
runs = 1000

[invariant]
runs = 256
depth = 60
fail_on_revert = false
